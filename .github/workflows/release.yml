# Release: push a tag like v0.1.0 and this builds a SIGNED APK and attaches it
# to a GitHub Release together with its SHA-256 checksum.
#
# Needs these repository secrets (same names as your other Android projects):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Turn the base64 secret back into a keystore file (kept outside the repo folder).
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kancard.jks"
          echo "KANCARD_KEYSTORE_FILE=$RUNNER_TEMP/kancard.jks" >> "$GITHUB_ENV"

      # Run the tests first: a release must never ship with failing tests.
      - name: Test and build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      # Name the APK after the tag and write its checksum.
      - name: Prepare files
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/KanCard-${GITHUB_REF_NAME}.apk"
          cd out && sha256sum "KanCard-${GITHUB_REF_NAME}.apk" > "KanCard-${GITHUB_REF_NAME}.apk.sha256"

      # Publish with the GitHub CLI (no third-party action needed).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "KanCard $GITHUB_REF_NAME" --generate-notes
